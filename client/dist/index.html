  <script>
    // KILL SWITCH: Desregistrar cualquier Service Worker y limpiar caches viejos corruptos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }

    // AUTO-VERSION CHECKER: Detecta actualizaciones automáticamente sin que el usuario presione F5
    (function() {
      let lastChecked = 0;
      async function checkVersion() {
        const now = Date.now();
        if (now - lastChecked < 45000) return; // Máximo una verificación cada 45 segundos
        lastChecked = now;

        try {
          const response = await fetch('/?_v=' + now, { cache: 'no-store' });
          if (!response.ok) return;
          const html = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          
          const currentScript = document.querySelector('script[src*="/assets/index-"]')?.getAttribute('src');
          const newScript = doc.querySelector('script[src*="/assets/index-"]')?.getAttribute('src');

          if (currentScript && newScript && currentScript !== newScript) {
            console.log('🔄 Nueva versión detectada:', newScript, '. Actualizando sistema...');
            window.location.reload();
          }
        } catch (e) {
          // Ignorar silenciosamente si está offline
        }
      }

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkVersion();
        }
      });
      window.addEventListener('focus', checkVersion);
      setInterval(checkVersion, 300000); // Chequeo periódico cada 5 minutos
    })();
  </script>

      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;

        flex-direction: column;
        align-items: center;

      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-text {
        margin-top: 20px;
        color: #64748b;
        font-size: 1.1rem;
        font-weight: 500;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 0.6;
        }

        50% {
          opacity: 1;
        }
      }
